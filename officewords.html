<!DOCTYPE html>
<html lang="en" class="bg-gray-100 text-gray-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional Verbs Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3.4.15/dist/vue.global.prod.js"></script>
</head>
<body class="min-h-screen flex flex-col p-4">
  <div id="app" class="max-w-5xl mx-auto">
    <h1 class="text-2xl font-bold text-center mb-4">Professional Verbs Explorer</h1>

    <div class="mb-4">
      <label class="block text-sm font-medium mb-1" for="category">Choose a category:</label>
      <select id="category" v-model="selectedCategory" class="w-full p-2 rounded bg-white border">
        <option disabled value="">-- Select a Category --</option>
        <option v-for="(verbs, category) in verbsData" :key="category" :value="category">
          {{ category }}
        </option>
      </select>
    </div>

    <div v-if="selectedCategory" class="bg-white shadow rounded p-4">
      <h2 class="text-xl font-semibold mb-2">{{ selectedCategory }}</h2>
      <ul class="flex flex-wrap gap-2">
        <li v-for="verb in verbsData[selectedCategory]" :key="verb" class="bg-blue-100 text-blue-800 px-3 py-1 rounded text-sm">
          {{ verb }}
        </li>
      </ul>
    </div>
  </div>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          selectedCategory: '',
          verbsData: {}
        };
      },
      async mounted() {
        // Replace this with your JSON file path or embed the object directly
        const response = await fetch('https://superb-squirrel-a2242e.netlify.app/verbs.json'); // Or use embedded JSON here
        this.verbsData = await response.json();
      }
    }).mount('#app');
  </script>
</body>
</html>
